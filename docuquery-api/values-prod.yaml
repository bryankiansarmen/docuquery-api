env: prod

replicaCount: 2

image:
  repository: docuquery-api
  tag: latest
  pullPolicy: IfNotPresent
  pullSecret: regcred

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1024Mi

redis:
  host: redis-master
  port: 6379

chroma:
  host: api.trychroma.com
  port: 443
  tenant: "e350d178-b35e-4353-93f8-2a2d8b8353f3"
  database: docuquery

mongo:
  url: "mongodb://$(MONGO_USER):$(MONGO_PASSWORD)@mongodb:27017/docuquery"
